# Kitty theme: Atom One Dark (matches the niri appearance.kdl palette)
#
# Save as ~/.config/kitty/themes/atom-one-dark.conf and add to kitty.conf:
#
#   include themes/atom-one-dark.conf
#
# or run: kitty +kitten themes --reload-in=all  (then pick it from the list)

foreground              #abb2bf
background              #161616
selection_foreground    #abb2bf
selection_background    #3e4451

cursor                  #61afef
cursor_text_color       #282c34
url_color               #56b6c2

# Window borders (matches niri border colors)
active_border_color     #61afef
inactive_border_color   #3e4451
bell_border_color       #e5c07b

# Title bar / OS window
wayland_titlebar_color  #21252b
macos_titlebar_color    #21252b

# Tab bar
active_tab_foreground   #d7dae0
active_tab_background   #282c34
inactive_tab_foreground #5c6370
inactive_tab_background #21252b
tab_bar_background      #181a1f

# Marks
mark1_foreground        #282c34
mark1_background        #61afef
mark2_foreground        #282c34
mark2_background        #e5c07b
mark3_foreground        #282c34
mark3_background        #c678dd

# Normal colors
color0  #282c34
color1  #e06c75
color2  #98c379
color3  #e5c07b
color4  #61afef
color5  #c678dd
color6  #56b6c2
color7  #abb2bf

# Bright colors
color8  #5c6370
color9  #e06c75
color10 #98c379
color11 #e5c07b
color12 #61afef
color13 #c678dd
color14 #56b6c2
color15 #ffffff

# Extra colors (orange and a few palette neighbors)
color16 #d19a66
color17 #be5046
